services:
  mysql:
    image: mysql:8.0
    container_name: mediconnect-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mediconnect_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: mediconnect-phpmyadmin
    restart: always
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8082:80"

  # Local LLM runner for the MediAsistent chatbot (OWASP LLM01 CTF challenges).
  # MIT-licensed, fully offline.
  #   docker exec -it mediconnect-ollama ollama pull qwen2.5:3b-instruct
  ollama:
    image: ollama/ollama:latest
    container_name: mediconnect-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  mysql_data:
  ollama_data: