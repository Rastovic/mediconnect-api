spring:
  application:
    name: mediconnect-api

  # [A04] Hardcoded credentials in a plain-text configuration file committed to the repository
  datasource:
    url: jdbc:mysql://localhost:3306/mediconnect_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # [A04] SQL schema visible in logs — leaks database structure and bound parameter values
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      # [A04] ddl-auto: update — Hibernate alters the schema on startup, bypassing Flyway migration control
      ddl-auto: update

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Checksum mismatches from comment-only edits (OWASP 2021 → 2025 renumbering)
    # are repaired on every startup by FlywayConfig.repairAndMigrate().

  servlet:
    multipart:
      # [A08] CWE-400 Uncontrolled Resource Consumption — no file-size ceiling.
      #        An attacker uploads a multi-gigabyte file; the JVM buffers it in heap
      #        (ContentCachingFilter has no contentCacheLimit either), causing OOM.
      #        Spring Boot default is 1MB/10MB; -1 disables the limit entirely.
      max-file-size: -1
      max-request-size: -1

  # [A04] Thymeleaf cache disabled — supports Server-Side Template Injection exploration
  thymeleaf:
    cache: false

  mvc:
    pathmatch:
      use-suffix-pattern: true

# [A04] All Actuator endpoints publicly exposed without authentication
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
    env:
      show-values: always

server:
  port: 8085
  # [A04] Full stack trace and internal error messages exposed to the client
  error:
    include-stacktrace: always
    include-message: always
    include-binding-errors: always
    include-exception: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    root: DEBUG
    com.mediconnect: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG

# [A02] CTF flag placement (#64 a02-config-secrets-dump). Seeded internal secret
#        exposed by GET /api/admin/config (raw Environment dump) and by
#        /actuator/env (show-values: always). Capture = reading it there.
mediconnect:
  internal:
    metadata-token: flag{a02_config_secrets_dump_caf015}
