spring:
  application:
    name: mediconnect-api

  # Credentials via environment variables — never committed to source.
  # Local dev: export DB_USERNAME=root DB_PASSWORD=root
  datasource:
    url: jdbc:mysql://localhost:3306/mediconnect_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    hibernate:
      # Flyway owns the schema. validate = Hibernate never mutates it.
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

  thymeleaf:
    cache: true

  mvc:
    pathmatch:
      use-suffix-pattern: false

# Actuator: expose only health + info; details only for authorized principals.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
    env:
      show-values: never

# Application secrets — all injected from the environment, no fallbacks.
# JWT_SECRET: base64 of >= 32 random bytes (openssl rand -base64 48)
app:
  jwt:
    secret: ${JWT_SECRET}
  prescription:
    sign:
      key: ${PRESC_SIGN_KEY}
  lab:
    sign:
      key: ${LAB_SIGN_KEY}

server:
  port: 8085
  # No internal error detail leaks to clients.
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    root: INFO
    com.mediconnect: INFO
    org.springframework.security: WARN
